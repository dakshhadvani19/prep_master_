name: One-time cleanup of non-main branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-non-main-branches-once.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/${REPOSITORY}" --jq '.default_branch')"
          if [[ "$default_branch" != "main" ]]; then
            echo "Refusing cleanup because the default branch is not main."
            exit 1
          fi

          mapfile -t branches < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/$branch"
          done

          mapfile -t remaining < <(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            printf 'Unexpected branches remain: %s\n' "${remaining[*]}"
            exit 1
          fi
          echo "Verified: main is the only remaining branch."
