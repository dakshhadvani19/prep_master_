name: Build Science & Pharmacy syllabus text JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/build_science_pharmacy_syllabus_txt.py'
      - '.github/workflows/build-science-pharmacy-syllabus-txt.yml'
      - 'Syllabus/Science_Pharmacy_Recovery_Kit_1/Science_Pharmacy_Syllabus_Recovery_Kit/Output/ACTIVE_PDF_MANIFEST.csv'
      - 'Syllabus/Science_Pharmacy_Recovery_Kit_1/Science_Pharmacy_Syllabus_Recovery_Kit/Output/Verified_PDFs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: science-pharmacy-syllabus-json
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install --upgrade pip pymupdf
      - name: Validate and extract approved Science & Pharmacy syllabus PDFs
        run: |
          python -m py_compile Syllabus/build_science_pharmacy_syllabus_txt.py
          python Syllabus/build_science_pharmacy_syllabus_txt.py
      - name: Commit generated semester JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add Syllabus/syllabus_txt/Science_Pharmacy/
          if git diff --cached --quiet; then
            echo "No Science & Pharmacy JSON changes to commit."
            exit 0
          fi
          git commit -m "Generate Science & Pharmacy semester syllabus JSON"
          git push
