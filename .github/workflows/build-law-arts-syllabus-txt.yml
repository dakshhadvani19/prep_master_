name: Build Law & Arts syllabus text JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/build_law_arts_syllabus_txt.py'
      - '.github/workflows/build-law-arts-syllabus-txt.yml'
      - 'Syllabus/Law_Arts_Recovery_Kit_1/Law_Arts_Syllabus_Recovery_Kit/Output/ACTIVE_PDF_MANIFEST.csv'
      - 'Syllabus/Law_Arts_Recovery_Kit_1/Law_Arts_Syllabus_Recovery_Kit/Output/Verified_PDFs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: law-arts-syllabus-json
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install --upgrade pip pymupdf
      - name: Validate and extract all Law & Arts syllabus PDFs
        run: |
          python -m py_compile Syllabus/build_law_arts_syllabus_txt.py
          python Syllabus/build_law_arts_syllabus_txt.py
      - name: Commit generated semester JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Syllabus/syllabus_txt/Law_Arts/
          if git diff --cached --quiet; then
            echo "No Law & Arts JSON changes to commit."
            exit 0
          fi
          git commit -m "Generate Law & Arts semester syllabus JSON"
          git push
