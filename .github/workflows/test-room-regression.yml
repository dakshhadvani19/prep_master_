name: Test Room regression checks

on:
  push:
    branches: [main]
    paths:
      - "global-exam-prep/**"
      - ".github/workflows/test-room-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "global-exam-prep/**"
      - ".github/workflows/test-room-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test-room-regression:
    name: Test Room regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - name: Run Test Room and persistence tests
        run: >-
          npm test --
          tests/testRoomSessionApi.test.js
          tests/test-room-session-utils.test.js
          tests/test-room-persistence-sql.test.js
          tests/testRoomShuffle.test.js
          tests/contextFitter.test.js
          tests/subjectExamPolicy.test.js


  course-upload-queue-regression:
    name: Course upload queue, subject identity and file validation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - name: Run upload queue, subject identity and catalog suites
        run: >-
          npm test --
          tests/admin-course-upload-validation.test.js
          tests/question-bank-parser.test.js
          tests/admin-course-uploads-api.test.js
          tests/admin-course-upload-worker.test.js
          tests/admin-course-uploads.test.jsx
          tests/admin-subjects-api.test.js
          tests/admin-courses.test.jsx
          tests/student-catalog.test.jsx
          tests/student-published-question-bank-api.test.js
      - name: Lint changed upload processing and subject identity files
        run: >-
          npx eslint
          api/admin-course-uploads.js
          api/admin-course-upload-worker.js
          api/admin-subjects.js
          api/exam-attempts.js
          api/test-room-session.js
          api/_lib/admin-course-upload-validation.js
          api/_lib/question-bank-parser.js
          src/components/AdminCourseUploads.jsx
          src/components/AdminSubjectEditor.jsx
          src/pages/AdminCourses.jsx
          src/utils/catalogApi.js
          tests/admin-course-uploads-api.test.js
          tests/admin-course-upload-worker.test.js
          tests/admin-subjects-api.test.js
          tests/admin-courses.test.jsx
          tests/student-catalog.test.jsx
          tests/student-published-question-bank-api.test.js
          tests/supabaseMock.js

  full-test-suite:
    name: Full Vitest suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm test

  lint:
    name: Repository ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm run lint

  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm run build
