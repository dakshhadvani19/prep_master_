name: Test Room regression checks

on:
  push:
    branches: [main]
    paths:
      - "global-exam-prep/**"
      - ".github/workflows/test-room-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "global-exam-prep/**"
      - ".github/workflows/test-room-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test-room-regression:
    name: Test Room regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - name: Run Test Room and persistence tests
        run: >-
          npm test --
          tests/testRoomSessionApi.test.js
          tests/test-room-session-utils.test.js
          tests/test-room-persistence-sql.test.js
          tests/testRoomShuffle.test.js
          tests/contextFitter.test.js
          tests/subjectExamPolicy.test.js

  full-test-suite:
    name: Full Vitest suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm test

  lint:
    name: Repository ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm run lint

  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-exam-prep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-exam-prep/package-lock.json
      - run: npm ci
      - run: npm run build
