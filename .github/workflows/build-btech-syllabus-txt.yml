name: Refresh B.Tech source PDFs and build syllabus JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/refresh_btech_collection.py'
      - 'Syllabus/build_btech_syllabus_txt.py'
      - '.github/workflows/build-btech-syllabus-txt.yml'
      - 'Syllabus/B.Tech programs/_PDF_Library/**'
      - 'Syllabus/B.Tech programs/_Catalogs/program_course_map.csv'
      - 'Syllabus/B.Tech programs/_Catalogs/program_catalog.csv'
      - 'Syllabus/B.Tech programs/_Catalogs/pdf_library_index.csv'
      - 'Syllabus/B.Tech programs/_Tools/Batch_2_Official_Collector/build_syllabus_archive.py'
      - 'Syllabus/B.Tech programs/_Tools/Batch_2_Official_Collector/programs.csv'
      - 'Syllabus/B.Tech programs/_Tools/Batch_2_Official_Collector/GTU_Fallback_Map.csv'
      - 'Syllabus/B.Tech programs/_Tools/Batch_2_Official_Collector/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btech-syllabus-json
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF collection and text extraction tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "Syllabus/B.Tech programs/_Tools/Batch_2_Official_Collector/requirements.txt"
          python -m pip install pymupdf
      - name: Refresh official B.Tech PDFs, catalogs, and JSON
        run: python Syllabus/refresh_btech_collection.py
      - name: Commit source PDFs, collection reports, indexes, and generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add 'Syllabus/B.Tech programs/_PDF_Library/'
          git add 'Syllabus/B.Tech programs/_Catalogs/'
          git add 'Syllabus/B.Tech programs/Programs/'
          git add 'Syllabus/syllabus_txt/B.Tech/'
          if git diff --cached --quiet; then
            echo "No B.Tech source or JSON changes to commit."
            exit 0
          fi
          git commit -m "Refresh all B.Tech syllabus sources and JSON"
          git push
