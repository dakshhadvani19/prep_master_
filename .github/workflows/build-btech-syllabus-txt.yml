name: Build B.Tech syllabus text JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/build_btech_syllabus_txt.py'
      - '.github/workflows/build-btech-syllabus-txt.yml'
      - 'Syllabus/B.Tech programs/_PDF_Library/**'
      - 'Syllabus/B.Tech programs/_Catalogs/program_course_map.csv'
      - 'Syllabus/B.Tech programs/_Catalogs/program_catalog.csv'
      - 'Syllabus/B.Tech programs/_Catalogs/pdf_library_index.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btech-syllabus-json
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install --upgrade pip pymupdf
      - name: Extract all B.Tech program syllabus text
        run: python Syllabus/build_btech_syllabus_txt.py
      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Syllabus/syllabus_txt/B.Tech/'
          if git diff --cached --quiet; then
            echo "No B.Tech JSON changes to commit."
            exit 0
          fi
          git commit -m "Generate B.Tech syllabus semester JSON"
          git push
