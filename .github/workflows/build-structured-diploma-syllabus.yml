name: Build structured Diploma syllabus JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/build_structured_diploma_syllabus.py'
      - 'Syllabus/syllabus_txt/Diploma/**'
      - '.github/workflows/build-structured-diploma-syllabus.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: structured-diploma-syllabus-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate per-subject syllabus and optional practical files
        run: python Syllabus/build_structured_diploma_syllabus.py
      - name: Commit generated Diploma JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Syllabus_Structured/Diploma/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate structured Diploma syllabus JSON"
          git push
