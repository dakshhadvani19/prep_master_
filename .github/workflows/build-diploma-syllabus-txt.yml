name: Build Diploma syllabus text JSON

on:
  push:
    branches:
      - main
    paths:
      - 'Syllabus/build_syllabus_txt.py'
      - '.github/workflows/build-diploma-syllabus-txt.yml'
      - 'Syllabus/Diploma_Full_Collection_1/Marwadi_Official_Diploma_Collector/Marwadi_Diploma_Syllabus_Collection/Verified_Syllabi/**'
      - 'global-exam-prep/temp_removed_subjects/diploma_active_syllabus_catalog_2026-10-12.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diploma-computer-engineering-syllabus-json
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: python -m pip install --upgrade pip pymupdf
      - name: Extract all Diploma course semester JSON files
        run: python Syllabus/build_syllabus_txt.py
      - name: Commit generated semester JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Syllabus/syllabus_txt/Diploma/
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi
          git commit -m "Generate Diploma semester syllabus JSON"
          git push
